name: RTL verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Check Python scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run scoreboard
        run: make test
      - name: Check RTL structure
        run: make elaborate
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-verification
          path: reports/rtl_*
